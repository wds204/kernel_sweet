name: Build Kernel

on:
  push:
    branches: [ "16" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            make gcc python3 zip

      - name: Download Clang toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q --tries=3 \
            https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang

      - name: Download GCC cross-compilers
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 $HOME/gcc32

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # Step 1: Load base defconfig
          make O=out ARCH=arm64 CC=clang sweet_defconfig

          # Step 2: Merge our custom fragment on top
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/sweet_perf.config

          # Step 3: Finalize config
          make O=out ARCH=arm64 CC=clang olddefconfig

          # Step 4: Build
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            2>&1 | tee build.log

      - name: Package into AnyKernel3 flashable zip
        run: |
          # Clone AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          # Configure it for sweet (Redmi Note 10 Pro)
          cat > AnyKernel3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=SweetKernel by wds204
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sweet
          device.name2=sweetin
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          . split_img;
          . patch_cmdline "skip_initramfs" "";
          . flash_boot;
          EOF

          # Copy kernel image
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null

          # Zip it up
          cd AnyKernel3
          zip -r9 ../kernel-sweet-android16-$(date +%Y%m%d).zip . \
            -x "*.git*" -x "README.md" -x "*.placeholder"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sweet-android16
          path: kernel-sweet-android16-*.zip
          retention-days: 7
